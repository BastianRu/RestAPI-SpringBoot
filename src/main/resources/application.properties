spring.application.name=apirest-springboot

# Puerto del servidor embebido
server.port=8080

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:productosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 disponible en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate crea/actualiza el esquema automáticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Carga de datos de prueba (data.sql) despues de que Hibernate crea las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
